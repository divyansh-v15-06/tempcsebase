# ==============================================================================
# Host Nginx Configuration for CSE Department Website (tempcse)
# ==============================================================================
# Target Domain: tempcse.nith.ac.in (or 'tempcse' locally on campus network)
# Backend Target: http://127.0.0.1:3000 (Host port published by Docker stack)
#
# Installation on the Server:
# 1. Copy this file to:
#    sudo cp deploy/host-nginx-tempcse.conf /etc/nginx/sites-available/tempcse
#
# 2. Enable the site (symlink into sites-enabled):
#    sudo ln -s /etc/nginx/sites-available/tempcse /etc/nginx/sites-enabled/
#    (Or if using conf.d: sudo cp deploy/host-nginx-tempcse.conf /etc/nginx/conf.d/tempcse.conf)
#
# 3. Test configuration (will not disrupt other running sites):
#    sudo nginx -t
#
# 4. Reload Nginx to apply changes:
#    sudo systemctl reload nginx
#
# NOTE: Do NOT use ports 8080, 5173, 8000, 8001 (used by other server services).
# ==============================================================================

server {
    listen 80;
    server_name tempcse.nith.ac.in tempcse;

    # Allow up to 25MB file uploads (for faculty profile images, resumes, etc.)
    client_max_body_size 25M;

    # Reverse proxy to the Docker Compose stack published on host port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document/report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}


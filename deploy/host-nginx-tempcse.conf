server {
    listen 80;
    listen [::]:80;
    server_name tempcse.nith.ac.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tempcse.nith.ac.in;

    client_max_body_size 25M;

    ssl_certificate /etc/nginx/ssl/cms.nith.ac.in/nith.crt;
    ssl_certificate_key /etc/nginx/ssl/cms.nith.ac.in/nith.ac.in.key;

    # Frontend (Next.js SSR on port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Node.js on port 3001)
    location /backend/ {
        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
